name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}${{ matrix.oldest && ' / oldest deps' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        oldest: [false]
        include:
          - os: windows-latest
            python: "3.12"
            oldest: false
          - os: macos-latest
            python: "3.12"
            oldest: false
          # Lowest versions declared in pyproject.toml.
          - os: ubuntu-latest
            python: "3.10"
            oldest: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin oldest supported dependencies
        if: matrix.oldest
        run: python -m pip install "numpy==1.26.0" "scipy==1.11.1"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import histrange, sys; print(histrange.__version__); sys.exit(histrange.master_range_grid().size != 41)"
